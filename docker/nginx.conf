server {
    listen 80;
    server_name _;
    root /var/www/html/public;

    index index.php;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "0" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;

    # Strict-Transport-Security: only enable when HTTPS is configured
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # Content-Security-Policy — set by Laravel SecurityHeaders middleware only.
    # Do NOT add add_header CSP here: nginx multiline strings produce a second
    # malformed header that browsers interpret as "block everything", killing
    # Lucide icon JS and other inline scripts.

    # Hide nginx version
    server_tokens off;

    # Limit request size
    client_max_body_size 20M;

    # Deny access to hidden files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Deny access to sensitive files
    location ~ (\.env|\.git|composer\.json|composer\.lock|artisan) {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Pass requests to PHP
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include /etc/nginx/fastcgi_params;

        # Include port in HTTP_HOST for correct asset URL generation
        fastcgi_param HTTP_HOST $host:$server_port;

        fastcgi_param PHP_VALUE "upload_max_filesize = 20M \n post_max_size = 20M";
    }

    # Static assets caching
    # NOTE: try_files fallback is required so virtual asset endpoints served by
    # PHP (e.g. Livewire's /livewire-{hash}/livewire.min.js) are NOT cut off by
    # this regex location. Without the fallback nginx returns 404 for any
    # real-file-only match that doesn't exist on disk (breaking Livewire JS).
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Deny direct access to storage (files served via controller)
    location ~ ^/storage/ {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Access and error logs
    access_log /var/log/nginx/dapense_access.log;
    error_log /var/log/nginx/dapense_error.log;
}
