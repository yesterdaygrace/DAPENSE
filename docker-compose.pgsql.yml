# PostgreSQL variant of docker-compose.yml — drop-in replacement for pgsql.
# Usage:
#   cp .env.example .env   # then set DB_CONNECTION=pgsql, DB_PORT=5432
#   docker compose -f docker-compose.pgsql.yml up --build -d
# or use profile overlay: docker compose -f docker-compose.yml -f docker-compose.pgsql.yml up -d

services:
  app:
    build:
      context: .
    image: dapense-app
    container_name: dapense-app
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
      - DOCKER=true
      - DB_HOST=dapense-postgres
      - DB_CONNECTION=pgsql
      - DB_PORT=5432
      - APP_URL=http://localhost:8080
    env_file:
      - .env
    volumes:
      - storage_data:/var/www/html/storage
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - internal
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
      - SETGID
      - SETUID
      - CHOWN
      - DAC_OVERRIDE
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /var/www/html/storage/framework/views
      - /var/www/html/storage/framework/cache
      - /var/www/html/storage/framework/sessions
      - /var/www/html/storage/logs
      - /var/www/html/bootstrap/cache
      - /var/log/nginx
      - /var/lib/nginx
      - /var/lib/redis
      - /tmp

  postgres:
    image: postgres:16-alpine
    container_name: dapense-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-dapense}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "${DB_EXTERNAL_PORT:-15432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres} -d ${DB_DATABASE:-dapense}"]
      interval: 5s
      timeout: 5s
      retries: 10
    command: >
      postgres
      -c max_connections=200
      -c shared_buffers=256MB

networks:
  internal:
    name: dapense-internal

volumes:
  postgres_data:
  storage_data:
