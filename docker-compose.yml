services:
  app:
    build:
      context: .
    image: dapense-app
    container_name: dapense-app
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
      - DOCKER=true
      - DB_HOST=dapense-mysql
      - APP_URL=http://localhost:8080
    env_file:
      - .env
    volumes:
      - storage_data:/var/www/html/storage
    depends_on:
      - mysql
      - redis
    networks:
      - internal
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
      - SETGID
      - SETUID
      - CHOWN
      - DAC_OVERRIDE
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /var/www/html/storage/framework/views
      - /var/www/html/storage/framework/cache
      - /var/www/html/storage/framework/sessions
      - /var/www/html/storage/logs
      - /var/www/html/bootstrap/cache
      - /var/log/nginx
      - /var/lib/nginx
      - /tmp

  mysql:
    image: mysql:8.4
    container_name: dapense-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_DATABASE}
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - internal
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: dapense-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD} --bind 0.0.0.0 --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    networks:
      - internal
    cap_drop:
      - ALL
    cap_add:
      - SETGID
      - SETUID
      - CHOWN
      - DAC_OVERRIDE
    security_opt:
      - no-new-privileges:true

networks:
  internal:
    name: dapense-internal

volumes:
  mysql_data:
  redis_data:
  storage_data:
